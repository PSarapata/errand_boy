[package]
name = "errand_boy"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "errand_boy"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7", features = ["desktop"] }
dioxus-desktop = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }
dirs = "5"
toml = "0.8"
open = "5"
urlencoding = "2"
futures = "0.3"

[profile.release]
opt-level = 3
lto = true
strip = true
