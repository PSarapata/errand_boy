[package]
name = "errand_boy"
version = "0.1.0"
edition = "2024"
description = "Desktop shopping assistant that groups and scores Google Shopping results with an LLM"
repository = "https://github.com/PSarapata/errand_boy"
license = "MIT"
readme = "README.md"

[[bin]]
name = "errand_boy"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7", features = ["desktop"] }
dioxus-desktop = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }
dirs = "5"
toml = "0.8"
open = "5"
urlencoding = "2"
futures = "0.3"

[profile.release]
opt-level = 3
lto = true
strip = false
